<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Portal</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; width: 90%; max-width: 600px; }
        input[type="text"] { width: 75%; padding: 12px 20px; font-size: 16px; color: #fff; background: #202124; border: 1px solid #3c4043; border-radius: 24px; outline: none; }
        button { padding: 12px 24px; font-size: 14px; background: #3886f7; color: #fff; border: none; border-radius: 20px; cursor: pointer; margin-left: 10px; }
        #results { margin-top: 30px; text-align: left; width: 100%; max-height: 50vh; overflow-y: auto; }
        .result-item { margin-bottom: 20px; background: #202124; padding: 15px; border-radius: 8px; }
        .result-item a { color: #8ab4f8; font-weight: bold; text-decoration: none; font-size: 18px; }
        .result-item p { color: #bdc1c6; margin: 5px 0 0 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Anonymous Search (Google Engine)</h2>
        <input type="text" id="query" placeholder="検索ワードを入力..." autocomplete="off">
        <button onclick="search()">検索</button>
        <div id="results"></div>
    </div>

    <script>
        function search() {
            var q = document.getElementById('query').value;
            var resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "<p style='color:#80868b;'>検索中...</p>";
            
            // Googleが一般公開している、規制できない公式の検索窓口（API）を利用
            var url = "https://google.com" + encodeURIComponent(q);
            
            // ページを移動せず、この画面の中でデータだけをこっそり受け取る（JSONP）
            var script = document.createElement('script');
            script.src = url;
            window.google = { ac: { h: function(data) {
                resultsDiv.innerHTML = "";
                var suggestions = data[1];
                if(suggestions.length === 0) {
                    resultsDiv.innerHTML = "<p>見つかりませんでした</p>";
                    return;
                }
                // 予測ワードからGoogleの検索結果への安全なリンクを生成
                suggestions.forEach(function(item) {
                    var word = item[0];
                    var itemUrl = "https://google.com" + encodeURIComponent(word);
                    var div = document.createElement('div');
                    div.className = "result-item";
                    div.innerHTML = "<a href='" + itemUrl + "' target='_blank'>🔗 " + word + " でGoogle検索を開く</a><p>学校のアカウント履歴に残さず安全にGoogleへ移動します。</p>";
                    resultsDiv.appendChild(div);
                });
            }}};
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
