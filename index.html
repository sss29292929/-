<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Test Portal</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; width: 90%; max-width: 600px; }
        button { padding: 12px 24px; font-size: 14px; background: #28a745; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #results { margin-top: 30px; text-align: left; width: 100%; max-height: 40vh; overflow-y: auto; }
        .res-item { background: #202124; padding: 15px; border-radius: 8px; border: 1px solid #28a745; }
    </style>
</head>
<body>
    <div class="box">
        <h2>i-Filter 最終通信テスト</h2>
        <!-- 他のサイトには絶対にジャンプせず、画面内だけで処理します -->
        <button type="button" onclick="doTest()">文部科学省の安全な通信をテスト</button>
        <div id="results"></div>
    </div>

    <script>
        function doTest() {
            var box = document.getElementById('results');
            box.innerHTML = "<p style='color:#80868b;'>日本で一番安全なサイトと通信中...</p>";
            
            // 文部科学省(mext.go.jp)の公式データを裏で読み込みます（学校で絶対禁止できないURL）
            var url = "https://mext.go.jp";
            
            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    box.innerHTML = "";
                    var div = document.createElement('div');
                    div.className = "res-item";
                    div.innerHTML = "<p style='color:#28a745; font-weight:bold;'>✔ テスト成功</p>"
                                  + "<span style='color:#bdc1c6; font-size:14px;'>文部科学省との通信に成功しました。画面は切り替わっていません。</span>";
                    box.appendChild(div);
                })
                .catch(err => {
                    box.innerHTML = "<p style='color:#ea4335;'>通信エラーが発生しました。</p>";
                });
        }
    </script>
</body>
</html>
