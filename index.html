<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 5px; display: inline-block; margin: 10px; width: 150px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .box:hover { background: #eef5ff; }
        span { color: #007bff; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <div class="box" onclick="openViaGoogle()">
        <span>匿名検索(G)</span>
    </div>

    <script>
        function openViaGoogle() {
            // Google翻訳の「ウェブサイト丸ごと翻訳機能」を使ってStartpageを呼び出します
            // 英語から日本語に翻訳する設定（sl=en, tl=ja）にしています
            var proxyUrl = "https://translate.goog";
            window.open(proxyUrl, '_blank');
        }
    </script>

</body>
</html>
